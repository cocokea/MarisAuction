name: MarisAuction
version: '1.0'
main: com.maris7.auctionhouse.MarisAuctionPlugin
api-version: '1.21'
folia-supported: true
load: POSTWORLD
description: MarisAuction auction house plugin
depend: [Vault, NBTAPI]
softdepend: [packetevents, MarisSettings]
libraries:
  - com.zaxxer:HikariCP:7.0.2
  - org.xerial:sqlite-jdbc:3.53.0.0
  - com.mysql:mysql-connector-j:9.7.0
commands:
  ah:
    description: Open the auction house or sell/search items.
    usage: /ah [sell <price>|<search>]
    aliases: [auction, auctions, auctionhouse]
  ahreload:
    description: Reload MarisAuction configuration.
    usage: /ahreload
    permission: marisauction.admin
permissions:
  marisauction.admin:
    default: op
  marisauction.sell.unlimited:
    default: op
  marisauction.sell.*:
    default: op
